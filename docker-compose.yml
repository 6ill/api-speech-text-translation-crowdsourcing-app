services:
  # 1. Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Celery Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. MLflow Server
  mlflow:
    image: python:3.10-slim
    command: >
      bash -c "pip install mlflow psycopg2-binary boto3 &&
      mlflow db upgrade postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME} &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
      --cors-allowed-origins '*'
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME}
      --default-artifact-root ${MLFLOW_S3_ARTIFACT_ROOT}"
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://object-storage:9100

    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started

  # 4. Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # 5. WORKER (INFERENCE)
  worker_inference:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.celery_app worker --loglevel=info -Q inference_queue -P solo
    env_file: .env
    depends_on:
      - redis
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 6. WORKER (PIPELINE)
  worker_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.celery_app worker --loglevel=info -Q ml_pipeline_queue -P solo
    env_file: .env
    depends_on:
      - redis
      - backend
    volumes:
        - ./src:/app/src
        - hf_cache:/app/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # # 7. Scheduler (Celery Beat)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - backend
  object-storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: true 
    volumes:
      - rustfs_data:/data 
    ports:
      - "9100:9000"
      - "9101:9001"

volumes:
  postgres_data:
  rustfs_data: 
  hf_cache: